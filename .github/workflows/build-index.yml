name: Rebuild tool index

on:
  push:
    branches: [main]
    # avoid infinite loop: don't retrigger on commits this workflow itself makes
    paths-ignore:
      - '.github/workflows/build-index.yml'

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build index.html
        run: python scripts/build-index.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "chore: auto-regenerate index.html [skip ci]"
            git push
          else
            echo "index.html unchanged, nothing to commit."
          fi
